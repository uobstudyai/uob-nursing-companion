<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UoB Nursing AI Companion</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

:root {
  --navy: #1F3864;
  --navy-light: #2E5494;
  --gold: #C8A84B;
  --gold-light: #F5E6B8;
  --blue: #3B82F6;
  --blue-light: #EFF6FF;
  --green: #059669;
  --green-light: #ECFDF5;
  --orange: #D97706;
  --orange-light: #FFFBEB;
  --purple: #7C3AED;
  --purple-light: #F5F3FF;
  --gray-50: #F9FAFB;
  --gray-100: #F3F4F6;
  --gray-200: #E5E7EB;
  --gray-400: #9CA3AF;
  --gray-600: #4B5563;
  --gray-800: #1F2937;
  --white: #FFFFFF;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
  --shadow: 0 4px 16px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.05);
  --shadow-lg: 0 20px 40px rgba(0,0,0,.12), 0 8px 16px rgba(0,0,0,.06);
  --radius: 16px;
  --radius-sm: 8px;
  --radius-xs: 6px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  font-family: 'Inter', 'Segoe UI', sans-serif;
  background: var(--gray-50);
  color: var(--gray-800);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── SCREENS ── */
.screen { display: none; flex: 1; flex-direction: column; min-height: 100vh; }
.screen.active { display: flex; }

/* ════════════════════════════════════════════
   ROLE SELECTION SCREEN
════════════════════════════════════════════ */
#role-screen {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 50%, #1a6b9a 100%);
  align-items: center; justify-content: center; padding: 24px;
}

.role-card {
  background: rgba(255,255,255,.07);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 24px;
  padding: 48px 40px;
  max-width: 520px; width: 100%;
  text-align: center;
}

.role-card .brand { margin-bottom: 32px; }
.role-card .brand-icon {
  width: 72px; height: 72px;
  background: var(--gold);
  border-radius: 20px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 32px; margin-bottom: 16px;
  box-shadow: 0 8px 24px rgba(200,168,75,.4);
}
.role-card h1 { color: white; font-size: 24px; font-weight: 700; margin-bottom: 4px; }
.role-card .subtitle { color: rgba(255,255,255,.65); font-size: 14px; }

.role-card h2 { color: rgba(255,255,255,.9); font-size: 15px; font-weight: 500; margin-bottom: 20px; }

.role-buttons { display: flex; flex-direction: column; gap: 12px; }

.role-btn {
  display: flex; align-items: center; gap: 16px;
  padding: 18px 20px;
  background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.18);
  border-radius: var(--radius);
  cursor: pointer; text-align: left;
  transition: all .2s; color: white;
  text-decoration: none;
}
.role-btn:hover {
  background: rgba(255,255,255,.18);
  border-color: rgba(255,255,255,.35);
  transform: translateY(-1px);
}
.role-btn .role-icon {
  width: 48px; height: 48px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
}
.role-btn.student .role-icon { background: rgba(59,130,246,.3); }
.role-btn.faculty .role-icon { background: rgba(5,150,105,.3); }
.role-btn.admin   .role-icon { background: rgba(124,58,237,.3); }
.role-btn .role-text strong { display: block; font-size: 15px; font-weight: 600; }
.role-btn .role-text span   { font-size: 12px; opacity: .7; }
.role-btn .arrow { margin-left: auto; opacity: .5; font-size: 18px; }

/* ════════════════════════════════════════════
   SHARED HEADER
════════════════════════════════════════════ */
.app-header {
  background: var(--navy);
  padding: 14px 24px;
  display: flex; align-items: center; gap: 14px;
  box-shadow: 0 2px 12px rgba(0,0,0,.2);
  flex-shrink: 0;
}
.app-header .logo {
  width: 40px; height: 40px; background: var(--gold);
  border-radius: 10px; display: flex; align-items: center;
  justify-content: center; font-size: 20px; flex-shrink: 0;
}
.app-header .header-text h1 { color: white; font-size: 16px; font-weight: 700; }
.app-header .header-text p  { color: rgba(255,255,255,.6); font-size: 11px; }
.header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.header-badge {
  padding: 4px 12px; border-radius: 20px;
  font-size: 11px; font-weight: 600;
  background: rgba(255,255,255,.12); color: rgba(255,255,255,.85);
}
.header-badge.student { background: rgba(59,130,246,.25); color: #93C5FD; }
.header-badge.faculty { background: rgba(5,150,105,.25); color: #6EE7B7; }
.header-badge.admin   { background: rgba(124,58,237,.25); color: #C4B5FD; }
.status-pill {
  display: flex; align-items: center; gap: 5px;
  color: rgba(255,255,255,.6); font-size: 11px;
}
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: #34D399; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

.back-btn {
  background: rgba(255,255,255,.1); border: none; color: rgba(255,255,255,.8);
  padding: 6px 14px; border-radius: var(--radius-xs);
  font-size: 12px; cursor: pointer; transition: all .2s;
}
.back-btn:hover { background: rgba(255,255,255,.2); }

/* ════════════════════════════════════════════
   STUDENT LOGIN
════════════════════════════════════════════ */
#student-login-screen {
  align-items: center; justify-content: center;
  background: linear-gradient(160deg, #EFF6FF 0%, #F9FAFB 60%, #F0FDF4 100%);
  padding: 24px;
}

.login-panel {
  background: white; border-radius: 24px;
  box-shadow: var(--shadow-lg);
  overflow: hidden; max-width: 460px; width: 100%;
}
.login-panel-header {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
  padding: 32px 36px;
  text-align: center;
}
.login-panel-header .icon {
  width: 60px; height: 60px; background: rgba(255,255,255,.15);
  border-radius: 16px; display: inline-flex; align-items: center;
  justify-content: center; font-size: 28px; margin-bottom: 14px;
}
.login-panel-header h2 { color: white; font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.login-panel-header p  { color: rgba(255,255,255,.65); font-size: 13px; }
.login-panel-body { padding: 32px 36px; }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block; font-size: 12px; font-weight: 600;
  color: var(--gray-600); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px;
}
.form-group input, .form-group select {
  width: 100%; padding: 11px 14px;
  border: 1.5px solid var(--gray-200);
  border-radius: var(--radius-sm); font-size: 14px;
  font-family: inherit; background: var(--gray-50);
  transition: all .2s; color: var(--gray-800);
}
.form-group input:focus, .form-group select:focus {
  outline: none; border-color: var(--blue);
  background: white; box-shadow: 0 0 0 3px rgba(59,130,246,.12);
}
.btn-primary {
  width: 100%; padding: 13px;
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
  color: white; border: none; border-radius: var(--radius-sm);
  font-size: 15px; font-weight: 600; cursor: pointer;
  transition: all .2s; font-family: inherit;
  box-shadow: 0 4px 12px rgba(31,56,100,.3);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(31,56,100,.35); }
.btn-secondary {
  width: 100%; padding: 10px;
  background: transparent; color: var(--gray-600);
  border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm);
  font-size: 13px; cursor: pointer; font-family: inherit;
  transition: all .2s; margin-top: 10px;
}
.btn-secondary:hover { border-color: var(--gray-400); color: var(--gray-800); }

.disclaimer-box {
  margin-top: 16px; padding: 12px 14px;
  background: var(--blue-light); border-radius: var(--radius-sm);
  font-size: 12px; color: var(--navy); line-height: 1.6;
  border-left: 3px solid var(--blue);
}

/* ════════════════════════════════════════════
   STUDENT CHAT INTERFACE
════════════════════════════════════════════ */
#student-chat-screen { background: var(--gray-100); }

.chat-layout {
  display: flex; flex: 1; overflow: hidden;
}

/* sidebar */
.chat-sidebar {
  width: 260px; background: white;
  border-right: 1px solid var(--gray-200);
  display: flex; flex-direction: column;
  flex-shrink: 0;
}
.sidebar-student {
  padding: 20px 16px 16px;
  border-bottom: 1px solid var(--gray-100);
}
.student-avatar {
  width: 44px; height: 44px; border-radius: 50%;
  background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 100%);
  display: flex; align-items: center; justify-content: center;
  color: white; font-size: 18px; font-weight: 700; margin-bottom: 10px;
}
.sidebar-student .name { font-size: 14px; font-weight: 600; color: var(--gray-800); }
.sidebar-student .course-tag {
  display: inline-block; margin-top: 4px;
  padding: 2px 10px; background: var(--blue-light); color: var(--blue);
  border-radius: 20px; font-size: 11px; font-weight: 600;
}
.sidebar-student .section-tag {
  display: inline-block; margin-top: 4px; margin-left: 4px;
  padding: 2px 10px; background: var(--gray-100); color: var(--gray-600);
  border-radius: 20px; font-size: 11px;
}

.sidebar-modes { padding: 12px 10px; flex: 1; }
.sidebar-modes p { font-size: 11px; font-weight: 600; color: var(--gray-400); text-transform: uppercase; letter-spacing: .6px; padding: 0 6px; margin-bottom: 8px; }
.mode-item {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 12px; border-radius: var(--radius-sm);
  cursor: pointer; transition: all .15s;
  border: none; background: none; width: 100%; text-align: left;
  font-family: inherit;
}
.mode-item:hover { background: var(--gray-100); }
.mode-item.active { background: var(--blue-light); }
.mode-item .mode-dot {
  width: 32px; height: 32px; border-radius: var(--radius-xs);
  display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
}
.mode-item.learn   .mode-dot { background: var(--blue-light); }
.mode-item.practice .mode-dot { background: var(--orange-light); }
.mode-item.check    .mode-dot { background: var(--green-light); }
.mode-item.active.learn   .mode-dot { background: rgba(59,130,246,.2); }
.mode-item .mode-info strong { display: block; font-size: 13px; font-weight: 600; color: var(--gray-800); }
.mode-item .mode-info span   { font-size: 11px; color: var(--gray-400); }
.mode-item.active .mode-info strong { color: var(--blue); }

.sidebar-bottom {
  padding: 12px 10px;
  border-top: 1px solid var(--gray-100);
}
.end-session-btn {
  width: 100%; padding: 10px; border-radius: var(--radius-sm);
  background: none; border: 1.5px solid var(--gray-200);
  color: var(--gray-400); font-size: 13px; cursor: pointer;
  font-family: inherit; transition: all .2s;
}
.end-session-btn:hover { border-color: #FCA5A5; color: #EF4444; background: #FEF2F2; }

/* chat main */
.chat-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.mode-banner {
  padding: 12px 20px;
  font-size: 13px; font-weight: 500;
  display: flex; align-items: center; gap: 8px;
  border-bottom: 1px solid var(--gray-200);
}
.mode-banner.learn    { background: var(--blue-light); color: var(--navy); }
.mode-banner.practice { background: var(--orange-light); color: var(--orange); }
.mode-banner.check    { background: var(--green-light); color: var(--green); }

#messages {
  flex: 1; overflow-y: auto; padding: 24px 20px;
  display: flex; flex-direction: column; gap: 16px;
}

.msg { display: flex; gap: 10px; animation: fadein .2s ease; }
@keyframes fadein { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
.msg.user { flex-direction: row-reverse; }

.msg-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; flex-shrink: 0; margin-top: 2px;
}
.msg.user .msg-avatar { background: var(--navy); color: white; font-weight: 700; font-size: 13px; }
.msg.ai   .msg-avatar { background: var(--gold-light); font-size: 18px; }

.bubble {
  max-width: 75%; padding: 13px 16px;
  font-size: 14px; line-height: 1.7;
}
.msg.user  .bubble {
  background: var(--navy); color: white;
  border-radius: 18px 4px 18px 18px;
  box-shadow: var(--shadow-sm);
}
.msg.ai .bubble {
  background: white; color: var(--gray-800);
  border-radius: 4px 18px 18px 18px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--gray-200);
}
.msg.ai.practice .bubble { border-left: 3px solid var(--orange); }
.msg.ai.check    .bubble { border-left: 3px solid var(--green); }
.msg.ai.learn    .bubble { border-left: 3px solid var(--blue); }

.typing-indicator { display: flex; gap: 5px; padding: 5px 2px; }
.typing-indicator span {
  width: 8px; height: 8px; border-radius: 50%; background: var(--gray-400);
  animation: bounce .9s infinite;
}
.typing-indicator span:nth-child(2){ animation-delay:.18s }
.typing-indicator span:nth-child(3){ animation-delay:.36s }
@keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

/* quick prompts */
.quick-chips {
  padding: 10px 20px 14px;
  display: flex; flex-wrap: wrap; gap: 7px;
  background: white; border-top: 1px dashed var(--gray-200);
}
.chip {
  padding: 6px 14px; border-radius: 20px;
  background: var(--gray-100); border: 1px solid var(--gray-200);
  font-size: 12px; color: var(--gray-600); cursor: pointer;
  font-family: inherit; transition: all .15s;
}
.chip:hover { background: var(--blue-light); border-color: var(--blue); color: var(--navy); }

/* input area */
.chat-input-area {
  background: white; border-top: 1px solid var(--gray-200);
  padding: 16px 20px;
  display: flex; gap: 10px; align-items: flex-end;
}
#user-input {
  flex: 1; resize: none;
  border: 1.5px solid var(--gray-200); border-radius: 12px;
  padding: 11px 16px; font-size: 14px; font-family: inherit;
  max-height: 130px; line-height: 1.5; background: var(--gray-50);
  transition: all .2s; color: var(--gray-800);
}
#user-input:focus {
  outline: none; border-color: var(--blue); background: white;
  box-shadow: 0 0 0 3px rgba(59,130,246,.1);
}
#user-input::placeholder { color: var(--gray-400); }
#send-btn {
  padding: 11px 20px;
  background: var(--navy); color: white;
  border: none; border-radius: 12px;
  font-size: 20px; cursor: pointer;
  transition: all .2s; flex-shrink: 0;
  box-shadow: var(--shadow-sm);
}
#send-btn:hover { background: var(--navy-light); transform: scale(1.03); }
#send-btn:disabled { background: var(--gray-400); transform: none; cursor: not-allowed; }

/* ════════════════════════════════════════════
   FACULTY PORTAL
════════════════════════════════════════════ */
#faculty-screen { background: var(--gray-50); }

.portal-layout {
  flex: 1; display: flex; flex-direction: column;
  max-width: 900px; width: 100%; margin: 0 auto; padding: 28px 24px;
}

.portal-welcome {
  background: linear-gradient(135deg, var(--green) 0%, #047857 100%);
  border-radius: var(--radius); padding: 28px 32px; margin-bottom: 24px; color: white;
  display: flex; align-items: center; gap: 20px;
}
.portal-welcome .welcome-icon { font-size: 48px; }
.portal-welcome h2 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.portal-welcome p  { opacity: .8; font-size: 14px; }

.cards-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
.info-card {
  background: white; border-radius: var(--radius); padding: 20px 22px;
  box-shadow: var(--shadow-sm); border: 1px solid var(--gray-200);
}
.info-card .card-icon { font-size: 28px; margin-bottom: 10px; }
.info-card h3 { font-size: 14px; font-weight: 600; color: var(--gray-600); margin-bottom: 4px; }
.info-card .card-value { font-size: 20px; font-weight: 700; color: var(--gray-800); }
.info-card .card-sub { font-size: 12px; color: var(--gray-400); margin-top: 2px; }

.section-card {
  background: white; border-radius: var(--radius); padding: 24px;
  box-shadow: var(--shadow-sm); border: 1px solid var(--gray-200); margin-bottom: 20px;
}
.section-card h3 { font-size: 16px; font-weight: 700; color: var(--gray-800); margin-bottom: 4px; }
.section-card .section-desc { font-size: 13px; color: var(--gray-400); margin-bottom: 20px; }

.audit-week {
  display: flex; align-items: center; gap: 14px; margin-bottom: 14px;
}
.audit-week label { font-size: 13px; font-weight: 600; color: var(--gray-600); min-width: 80px; }
.week-select {
  padding: 8px 14px; border: 1.5px solid var(--gray-200);
  border-radius: var(--radius-xs); font-size: 13px; font-family: inherit;
  background: var(--gray-50);
}
.week-select:focus { outline: none; border-color: var(--green); }

.audit-table { width: 100%; border-collapse: collapse; }
.audit-table th {
  background: var(--gray-50); padding: 10px 14px;
  text-align: left; font-size: 12px; font-weight: 600;
  color: var(--gray-600); text-transform: uppercase; letter-spacing: .5px;
  border-bottom: 2px solid var(--gray-200);
}
.audit-table td {
  padding: 12px 14px; border-bottom: 1px solid var(--gray-100);
  font-size: 13px; vertical-align: top;
}
.audit-table tr:hover td { background: var(--gray-50); }
.accuracy-select {
  padding: 5px 10px; border: 1.5px solid var(--gray-200);
  border-radius: var(--radius-xs); font-size: 12px;
  font-family: inherit; background: white;
}
.accuracy-select:focus { outline: none; border-color: var(--green); }
.accuracy-select.accurate { border-color: var(--green); color: var(--green); background: var(--green-light); }
.accuracy-select.inaccurate { border-color: #EF4444; color: #EF4444; background: #FEF2F2; }

.audit-notes {
  width: 100%; padding: 8px 12px;
  border: 1.5px solid var(--gray-200); border-radius: var(--radius-xs);
  font-size: 12px; font-family: inherit; resize: vertical; min-height: 44px;
}
.audit-notes:focus { outline: none; border-color: var(--green); }

.submit-audit-btn {
  padding: 12px 28px;
  background: var(--green); color: white;
  border: none; border-radius: var(--radius-sm);
  font-size: 14px; font-weight: 600; cursor: pointer;
  font-family: inherit; transition: all .2s;
  box-shadow: 0 4px 12px rgba(5,150,105,.25);
}
.submit-audit-btn:hover { background: #047857; transform: translateY(-1px); }

.faculty-login-form {
  background: white; border-radius: var(--radius); padding: 32px;
  box-shadow: var(--shadow-lg); max-width: 420px; width: 100%;
}

/* ════════════════════════════════════════════
   ADMIN DASHBOARD
════════════════════════════════════════════ */
#admin-screen { background: var(--gray-50); }

.admin-layout {
  flex: 1; display: flex; flex-direction: column;
  max-width: 960px; width: 100%; margin: 0 auto; padding: 28px 24px;
}

.admin-welcome {
  background: linear-gradient(135deg, var(--purple) 0%, #5B21B6 100%);
  border-radius: var(--radius); padding: 28px 32px; margin-bottom: 24px; color: white;
  display: flex; align-items: center; gap: 20px;
}
.admin-welcome .welcome-icon { font-size: 48px; }
.admin-welcome h2 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.admin-welcome p  { opacity: .8; font-size: 14px; }

.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
.stat-card {
  background: white; border-radius: var(--radius); padding: 18px 20px;
  box-shadow: var(--shadow-sm); border: 1px solid var(--gray-200); text-align: center;
}
.stat-card .stat-icon { font-size: 26px; margin-bottom: 8px; }
.stat-card .stat-num { font-size: 26px; font-weight: 700; color: var(--gray-800); }
.stat-card .stat-label { font-size: 12px; color: var(--gray-400); margin-top: 2px; }

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }

.admin-card {
  background: white; border-radius: var(--radius); padding: 22px;
  box-shadow: var(--shadow-sm); border: 1px solid var(--gray-200);
}
.admin-card h3 { font-size: 15px; font-weight: 700; color: var(--gray-800); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

.course-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0; border-bottom: 1px solid var(--gray-100);
}
.course-row:last-child { border-bottom: none; }
.course-row .course-info strong { display: block; font-size: 13px; font-weight: 600; }
.course-row .course-info span   { font-size: 12px; color: var(--gray-400); }
.status-badge {
  padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
}
.status-badge.active  { background: var(--green-light); color: var(--green); }
.status-badge.pending { background: var(--orange-light); color: var(--orange); }
.status-badge.ready   { background: var(--blue-light); color: var(--blue); }

.timeline-item {
  display: flex; gap: 12px; padding: 10px 0;
  border-bottom: 1px solid var(--gray-100);
}
.timeline-item:last-child { border-bottom: none; }
.timeline-dot {
  width: 10px; height: 10px; border-radius: 50%;
  margin-top: 5px; flex-shrink: 0;
}
.timeline-dot.done { background: var(--green); }
.timeline-dot.now  { background: var(--blue); box-shadow: 0 0 0 3px rgba(59,130,246,.2); }
.timeline-dot.soon { background: var(--gray-300); }
.timeline-item .t-title { font-size: 13px; font-weight: 600; color: var(--gray-800); }
.timeline-item .t-date  { font-size: 11px; color: var(--gray-400); margin-top: 2px; }

.action-btn {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 12px 14px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--gray-200); background: var(--gray-50);
  cursor: pointer; transition: all .2s; text-decoration: none;
  font-family: inherit; margin-bottom: 8px; color: var(--gray-700); font-size: 13px;
}
.action-btn:hover { border-color: var(--purple); color: var(--purple); background: var(--purple-light); }
.action-btn .ab-icon { font-size: 18px; }
.action-btn .ab-text strong { display: block; font-weight: 600; font-size: 13px; }
.action-btn .ab-text span   { font-size: 11px; color: var(--gray-400); }
.action-btn .ab-arrow { margin-left: auto; color: var(--gray-400); }

.admin-login-form {
  background: white; border-radius: var(--radius); padding: 32px;
  box-shadow: var(--shadow-lg); max-width: 380px; width: 100%;
}

/* ════════════════════════════════════════════
   SHARED LOGIN WRAPPERS

  background: linear-gradient(160deg, #ECFDF5 0%, #F9FAFB 60%, #EFF6FF 100%);
}
.portal-login-screen.admin-bg {

}

/* ════════════════════════════════════════════
   TOAST
════════════════════════════════════════════ */
#toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--gray-800); color: white;
  padding: 12px 20px; border-radius: 10px; font-size: 13px;
  opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 999;
  box-shadow: var(--shadow);
}
#toast.show { opacity: 1; }

/* scrollbar */
#messages::-webkit-scrollbar { width: 4px; }
#messages::-webkit-scrollbar-thumb { background: var(--gray-200); border-radius: 2px; }

/* responsive */
@media (max-width: 640px) {
  .chat-sidebar { display: none; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .two-col { grid-template-columns: 1fr; }
  .cards-grid { grid-template-columns: 1fr; }
  .form-row { grid-template-columns: 1fr; }
}
